# 默认启用双重认证；关闭仅用于离线测试，不得用于部署。
server.address=127.0.0.1
server.port=8081
spring.application.name=opspilot-business-service
# 错误响应不暴露内部异常消息或堆栈。
server.error.include-message=never
server.error.include-stacktrace=never
opspilot.auth.required=${OPSPILOT_AUTH_REQUIRED:true}
opspilot.auth.tokens=${OPSPILOT_AUTH_TOKENS:}
opspilot.internal-service-token=${OPSPILOT_INTERNAL_SERVICE_TOKEN:}

# 默认保持内存后端，便于离线学习和快速测试；部署时显式切到 postgres。
opspilot.return-store.backend=${RETURN_DRAFT_STORE_BACKEND:memory}
opspilot.return-store.jdbc-url=${BUSINESS_DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/opspilot}
opspilot.return-store.username=${POSTGRES_USER:opspilot}
opspilot.return-store.password=${POSTGRES_PASSWORD:change_this_local_password}
