name: Agent evaluation regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opspilot_test
          POSTGRES_PASSWORD: ci-local-test-only
          POSTGRES_DB: opspilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opspilot_test -d opspilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://opspilot_test:ci-local-test-only@127.0.0.1:5432/opspilot_test
      REDIS_URL: " "
      TICKET_REPOSITORY_BACKEND: memory
      ORDER_QUERY_BACKEND: memory
      KNOWLEDGE_STORE_BACKEND: memory
      OPSPILOT_AUTH_REQUIRED: "false"
      OPSPILOT_MODEL_PROVIDER: zhipu
      MODEL_RATE_LIMIT_REQUESTS: "0"
      SILICONFLOW_API_KEY: " "
      RUN_REDIS_INTEGRATION: "0"
      RUN_REDIS_RATE_LIMIT_INTEGRATION: "0"
      RUN_POSTGRES_INTEGRATION: "0"
      RUN_PORTAL_POSTGRES_INTEGRATION: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline tests
        run: python -X utf8 -m unittest discover -s tests

      - name: Run demo page tests
        run: node --test static/demo.test.cjs static/service.test.cjs static/portal.test.cjs

      - name: Verify account transactions and session revocation with PostgreSQL
        env:
          RUN_PORTAL_POSTGRES_INTEGRATION: "1"
        run: >-
          python -X utf8 -m unittest
          tests.test_portal_postgres_integration tests.test_portal_registration

      - name: Generate current Agent evaluation report
        run: >-
          python -X utf8 scripts/run_agent_evaluation.py
          --mode mock
          --runtime isolated
          --output output/evaluation/current-agent-evaluation.json

      - name: Check Agent evaluation regression
        run: >-
          python -X utf8 scripts/check_agent_regression.py
          --baseline reports/agent-v2-offline-20260923.json
          --current output/evaluation/current-agent-evaluation.json

  java-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Spring Boot tests
        working-directory: business-service
        run: mvn -B -ntp test
