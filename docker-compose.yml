name: opspilot

services:
  postgres:
    # 固定 PostgreSQL 16 与 pgvector 版本；不使用 latest，避免课程环境无提示升级。
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    container_name: opspilot-postgres
    ports:
      - "5432:5432"
    environment:
      # 本地 .env 只保存开发配置，且已被 .gitignore 排除。
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # 数据卷让容器重建后仍保留数据库文件。
      - opspilot_postgres_data:/var/lib/postgresql/data
      # 仅在首次初始化空数据卷时执行：创建 pgvector、表和演示数据。
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # Redis Stack 额外包含 RedisJSON 与 RediSearch，供 LangGraph RedisSaver 保存并索引 Checkpoint。
    image: redis/redis-stack-server:latest
    container_name: opspilot-redis
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    environment:
      # 不覆盖 Redis Stack 默认启动脚本；由脚本加载 RedisJSON 与 RediSearch。
      # AOF 让 Redis 重启后也能从磁盘恢复数据；教学版仍需注意备份与过期策略。
      REDIS_ARGS: "--appendonly yes"
    volumes:
      - opspilot_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  business-service:
    build:
      context: ./business-service
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-docker.m.daocloud.io}
    container_name: opspilot-business-service
    ports:
      - "8081:8081"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      RETURN_DRAFT_STORE_BACKEND: postgres
      BUSINESS_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/api/orders/O-2001"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-docker.m.daocloud.io}
    container_name: opspilot-api
    ports:
      - "8011:8011"
    environment:
      REDIS_URL: redis://redis:6379/0
      TICKET_REPOSITORY_BACKEND: postgres
      KNOWLEDGE_STORE_BACKEND: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ORDER_QUERY_BACKEND: java
      ORDER_SERVICE_URL: http://business-service:8081
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      business-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    volumes:
      - opspilot_model_cache:/home/opspilot/.cache/fastembed

volumes:
  opspilot_postgres_data:
  opspilot_redis_data:
  opspilot_model_cache:
