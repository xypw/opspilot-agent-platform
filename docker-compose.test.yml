# 仅在显式运行时启动 Maven 测试容器；复用当前 Compose 的 PostgreSQL 网络。
services:
  java-tests:
    image: ${IMAGE_REGISTRY:-docker.m.daocloud.io}/library/maven:3.9.11-eclipse-temurin-17-alpine
    working_dir: /workspace
    volumes:
      - ./business-service:/workspace
      - ./.maven-cache:/root/.m2/repository
    environment:
      RETURN_DRAFT_STORE_BACKEND: postgres
      RUN_POSTGRES_INTEGRATION: "true"
      BUSINESS_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
